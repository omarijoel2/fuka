kind = "web"
previewPath = "/"
title = "KAFU Foundation Layer"
version = "1.0.0"
id = "artifacts/kafu-foundation"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26208

[services.development]
run = "pnpm --filter @workspace/kafu-foundation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kafu-foundation", "run", "build" ]
publicDir = "artifacts/kafu-foundation/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26208"
BASE_PATH = "/"
