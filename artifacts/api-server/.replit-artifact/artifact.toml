kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/storage"]

[services.development]
run = "cd /home/runner/workspace/artifacts/kafu-api/public && php -d upload_max_filesize=20M -d post_max_size=25M -S 0.0.0.0:$PORT /home/runner/workspace/artifacts/kafu-api/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

[services.env]
PORT = "8080"

[services.production]

[services.production.build]
args = ["echo", "no-build"]

[services.production.run]
args = ["php", "artisan", "serve", "--host=0.0.0.0", "--port=$PORT"]

[services.production.run.env]
PORT = "8080"
APP_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
