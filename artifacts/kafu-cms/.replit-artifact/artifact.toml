kind = "web"
previewPath = "/kafu-cms/"
title = "KAFU CMS Admin"
version = "1.0.0"
id = "artifacts/kafu-cms"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/kafu-cms/" ]
localPort = 24962

[services.development]
run = "pnpm --filter @workspace/kafu-cms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kafu-cms", "run", "build" ]
publicDir = "artifacts/kafu-cms/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24962"
BASE_PATH = "/kafu-cms/"
